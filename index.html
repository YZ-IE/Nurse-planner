<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#F0F3F8"/>
<title>N-Planr</title>
<script>
/* Anti-flash dark : applique le fond avant le premier rendu */
(function(){try{
  var d=localStorage.getItem('nplanr_dark');
  var dark=d!==null?d==='true':(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  if(dark){
    document.querySelector('meta[name="theme-color"]').content='#0D1117';
    document.documentElement.style.background='#0D1117';
    document.addEventListener('DOMContentLoaded',function(){document.body.style.background='#0D1117';});
  }
}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{color-scheme:light dark}
body{background:#F0F3F8;overscroll-behavior:none;font-family:'DM Sans',system-ui,sans-serif;font-size:15px}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:#C8D3E5;border-radius:2px}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
